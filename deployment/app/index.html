<!doctype html>
<html lang="ru">
<meta charset="utf-8"><title>Кот или собака</title>
<style>
  body {font: 18px sans-serif; max-width: 620px; margin: 8vh auto; padding: 22px}
  button {padding: 8px 14px}
  #preview {max-width: 100%; max-height: 420px; margin-top: 18px}
  #result {font-weight: bold}
</style>
<h1>Кот или собака?</h1>
<form id="form">
  <input id="photo" name="file" type="file" accept="image/*" aria-label="Фотография" required>
  <button>Определить</button>
</form>
<img id="preview" alt="Выбранная фотография" hidden>
<p id="result" role="status"></p>
<script>
  const form = document.getElementById("form");
  const photo = document.getElementById("photo");
  const preview = document.getElementById("preview");
  const result = document.getElementById("result");
  let requestVersion = 0;

  preview.onload = () => { preview.hidden = false; };
  photo.onchange = () => {
    requestVersion++;
    result.textContent = "";
    preview.hidden = true;

    const previous = preview.getAttribute("src");
    if (previous) URL.revokeObjectURL(previous);
    const file = photo.files[0];
    if (file) {
      preview.src = URL.createObjectURL(file);
    } else {
      preview.removeAttribute("src");
    }
  };

  form.onsubmit = async event => {
    event.preventDefault();
    const version = ++requestVersion;
    result.textContent = "Обработка…";
    let message;

    try {
      const response = await fetch("/predict", {method: "POST", body: new FormData(form)});
      const data = await response.json();
      message = response.ok ? "Класс: " + data.label : data.detail;
    } catch {
      message = "Сервер недоступен";
    }

    if (version === requestVersion) result.textContent = message;
  };
</script>
</html>
